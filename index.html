<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#171b34" />
    <meta name="description" content="左右滑动、选择强化、自动射击的竖屏 3D 跑酷游戏。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>火力冲刺</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="火力冲刺 3D 游戏画面"></canvas>

      <section class="hud" aria-live="polite">
        <div class="hud__top">
          <div class="health" aria-label="生命值">
            <span class="health__icon">❤</span>
            <div class="meter"><span id="health-fill"></span></div>
            <b id="health-text">100</b>
            <span id="shield-chip" class="shield-chip" aria-label="护盾值">🛡 <b id="shield-text">0</b></span>
          </div>
          <div class="hud__actions">
            <button id="sound-button" class="sound-button" type="button" aria-pressed="false" aria-label="关闭音效">🔊</button>
            <div class="level-chip" aria-label="当前关卡">
              <span>关卡 <b id="level-number">1</b></span>
              <strong id="level-name">地表矿洞</strong>
            </div>
          </div>
        </div>
        <div class="progress" aria-label="关卡进度">
          <span id="progress-fill"></span>
          <i id="progress-runner">●</i>
          <b>👹</b>
        </div>
        <div class="stats">
          <span>武器 <b id="weapon-stat">手枪</b></span>
          <span>人数 <b id="crew-stat">1</b></span>
          <span>伤害 <b id="damage-stat">10</b></span>
          <span>射速 <b id="rate-stat">1.8</b>/秒</span>
          <span>弹道 <b id="shot-stat">1</b></span>
        </div>
        <div class="mission-chip" aria-live="polite">
          <strong id="segment-stat">地表突围</strong>
          <span id="vehicle-stat">徒步</span>
          <span id="direction-stat">火力向前</span>
        </div>
        <div id="combo" class="combo" aria-hidden="true">连击 <b id="combo-text">×2</b></div>
        <div id="boss-hud" class="boss-hud" aria-hidden="true">
          <div><span>最终首领</span><b id="boss-health-text">620</b></div>
          <div class="boss-meter"><span id="boss-health-fill"></span></div>
        </div>
        <p id="hint" class="hint">按住左右滑动 · 自动射击</p>
        <div id="announcement" class="announcement" role="status"></div>
      </section>

      <section id="start-screen" class="screen screen--start screen--visible">
        <div class="brand">
          <p class="brand__eyebrow">RUN · CHOOSE · POWER UP</p>
          <h1>火力<br /><em>冲刺</em></h1>
          <p>选择战区，一路轰到 Boss！</p>
        </div>
        <div class="level-picker">
          <div class="level-picker__heading">
            <strong>选择战区</strong>
            <span>5 个战区全部开放</span>
          </div>
          <div id="level-options" class="level-options" role="group" aria-label="选择要挑战的关卡"></div>
        </div>
        <button id="start-button" class="primary-button" type="button">开始冲刺</button>
        <small>手机拖动 / 电脑方向键</small>
      </section>

      <section id="end-screen" class="screen" aria-hidden="true">
        <div class="result-card">
          <span id="result-icon" class="result-card__icon">🏆</span>
          <p id="result-kicker">BOSS 击破</p>
          <h2 id="result-title">冲刺成功！</h2>
          <div class="result-card__score">本局得分 <b id="score-text">0</b></div>
          <div class="result-card__details">
            <span>击破 <b id="kills-text">0</b></span>
            <span>最高连击 <b id="best-combo-text">×1</b></span>
          </div>
          <button id="restart-button" class="primary-button" type="button">再来一局</button>
        </div>
      </section>

      <p id="a11y-state" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
